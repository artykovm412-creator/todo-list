<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo List</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding-top: 80px;
        }

        .todo {
            width: 100%;
            max-width: 600px;
            padding: 30px;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 30px;
            color: #222;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #taskInput {
            flex: 1;
            height: 50px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        #taskInput:focus {
            border-color: #555;
        }

        #addButton {
            height: 50px;
            padding: 0 22px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        #addButton:hover {
            background: #444;
        }

        #taskList {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task {
            background: white;
            border-radius: 8px;
            min-height: 55px;
            padding: 10px 12px 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            border: 1px solid #e5e5e5;
        }

        .task-text {
            flex: 1;
            font-size: 17px;
            color: #222;
            cursor: pointer;
            word-break: break-word;
        }

        .task.completed .task-text {
            text-decoration: line-through;
            color: #999;
        }

        .delete-button {
            border: none;
            background: #eee;
            color: #333;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .delete-button:hover {
            background: #ddd;
        }

        #emptyMessage {
            text-align: center;
            color: #999;
            margin-top: 25px;
            font-size: 16px;
        }

        @media (max-width: 600px) {
            body {
                padding-top: 30px;
            }

            .todo {
                padding: 20px;
            }

            h1 {
                font-size: 30px;
            }

            .input-box {
                flex-direction: column;
            }

            #addButton {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="todo">

        <h1>Todo List</h1>

        <div class="input-box">
            <input
                id="taskInput"
                type="text"
                placeholder="Введите задачу..."
                autocomplete="off"
            >

            <button id="addButton">
                Добавить
            </button>
        </div>

        <div id="taskList"></div>

        <div id="emptyMessage">
            Пока нет задач
        </div>

    </div>

    <script>
        const taskInput = document.getElementById("taskInput");
        const addButton = document.getElementById("addButton");
        const taskList = document.getElementById("taskList");
        const emptyMessage = document.getElementById("emptyMessage");

        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function renderTasks() {
            taskList.innerHTML = "";

            if (tasks.length === 0) {
                emptyMessage.style.display = "block";
                return;
            }

            emptyMessage.style.display = "none";

            tasks.forEach((task, index) => {

                const taskElement = document.createElement("div");
                taskElement.className = "task";

                if (task.completed) {
                    taskElement.classList.add("completed");
                }

                const taskText = document.createElement("div");
                taskText.className = "task-text";
                taskText.textContent = task.text;

                taskText.addEventListener("click", () => {
                    tasks[index].completed = !tasks[index].completed;

                    saveTasks();
                    renderTasks();
                });

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-button";
                deleteButton.textContent = "Удалить";

                deleteButton.addEventListener("click", () => {
                    tasks.splice(index, 1);

                    saveTasks();
                    renderTasks();
                });

                taskElement.appendChild(taskText);
                taskElement.appendChild(deleteButton);

                taskList.appendChild(taskElement);
            });
        }

        function addTask() {

            const text = taskInput.value.trim();

            if (text === "") {
                return;
            }

            tasks.push({
                text: text,
                completed: false
            });

            saveTasks();

            taskInput.value = "";

            renderTasks();

            taskInput.focus();
        }

        addButton.addEventListener("click", addTask);

        taskInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                addTask();
            }
        });

        renderTasks();
    </script>

</body>
</html>
